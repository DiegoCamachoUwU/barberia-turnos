services:
  - type: web
    name: barberia-turnos-api
    runtime: node
    rootDir: backend
    region: ohio
    plan: free
    buildCommand: npm ci && npm run db:generate
    startCommand: npm run db:migrate:deploy && npm run db:seed && npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
