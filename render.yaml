services:
  - type: web
    name: barberia-turnos-api
    runtime: node
    rootDir: backend
    region: ohio
    plan: free
    buildCommand: npm ci && npm run db:generate
    startCommand: npm run db:migrate:deploy && npm run db:seed && npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      # Notificaciones post-reserva (Frente 1)
      - key: NOTIFICATION_CHANNEL
        sync: false
      - key: APP_BASE_URL
        sync: false
      # WhatsApp vía Twilio (REST)
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      # WhatsApp vía Evolution API
      - key: EVOLUTION_API_URL
        sync: false
      - key: EVOLUTION_API_INSTANCE
        sync: false
      - key: EVOLUTION_API_TOKEN
        sync: false
      # Email vía Resend
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
